<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5ef">
<title>A little check-in</title>
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<link rel="stylesheet" href="upset.css">
<script src="upset.js" defer></script>
</head>
<body>
<main class="page">
<header><span class="mark" aria-hidden="true">✳</span><span>a little check-in</span><span class="aside">one thing at a time</span></header>
<div class="progress-wrap" hidden><p id="progress-label"></p><progress id="progress" max="12" value="0" aria-labelledby="progress-label"></progress></div>
<section id="scene" aria-labelledby="title"></section>
<nav aria-label="Check-in controls"><button id="back" hidden>← Go back</button><button id="restart" hidden>Start over</button></nav>
<footer><p>No timer. No perfect answers. You can stop whenever you need.</p><p class="small">Inspired by <a href="https://youfeellikeshit.com/">You Feel Like Shit</a>. This check-in doesn’t save your answers.</p></footer>
<noscript><p>Please enable JavaScript to use this check-in.</p></noscript>
</main>
</body>
</html>
